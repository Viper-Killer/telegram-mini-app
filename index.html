<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Telegram Mini App</title>
  <!-- Подключаем официальную библиотеку Telegram Mini App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #ffffff);
      --sec-bg: var(--tg-theme-secondary-bg-color, #f4f4f5);
      --text: var(--tg-theme-text-color, #18181b);
      --hint: var(--tg-theme-hint-color, #71717a);
      --btn: var(--tg-theme-button-color, #2481cc);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: var(--sec-bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: var(--bg);
      width: 100%;
      max-width: 380px;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      text-align: center;
    }
    .avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, #38bdf8, #2481cc);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 4px 12px rgba(36, 129, 204, 0.3);
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
    }
    .subtitle {
      font-size: 14px;
      color: var(--hint);
    }
    .score-container {
      margin: 8px 0;
    }
    .score-number {
      font-size: 48px;
      font-weight: 900;
      color: var(--btn);
      line-height: 1;
    }
    .progress-bar {
      width: 100%;
      height: 12px;
      background: var(--sec-bg);
      border-radius: 6px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, var(--btn));
      border-radius: 6px;
      transition: width 0.2s ease;
    }
    .click-target {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: linear-gradient(145deg, #2481cc, #1b65a4);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(36, 129, 204, 0.4);
      transition: transform 0.08s ease;
      margin: 8px 0;
    }
    .click-target:active {
      transform: scale(0.92);
    }
    .send-btn {
      width: 100%;
      background: var(--btn);
      color: var(--btn-text);
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      transition: opacity 0.2s ease;
    }
    .send-btn:active {
      opacity: 0.85;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="avatar">⚡</div>
    <div>
      <h1 id="user-greeting">Привет!</h1>
      <p class="subtitle">Ваше первое Telegram Mini App</p>
    </div>

    <div class="score-container">
      <div class="score-number" id="score">0</div>
      <p class="subtitle" id="goal-text">Цель: 20 кликов</p>
    </div>

    <div class="progress-bar">
      <div class="progress-fill" id="progress"></div>
    </div>

    <div class="click-target" id="tap-btn">🚀</div>

    <button class="send-btn" id="send-btn">Отправить результат боту</button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    let count = 0;
    const target = 20;

    // Персонализация под пользователя
    const user = tg?.initDataUnsafe?.user;
    if (user && user.first_name) {
      document.getElementById('user-greeting').textContent = `Привет, ${user.first_name}!`;
    }

    const scoreEl = document.getElementById('score');
    const progressEl = document.getElementById('progress');
    const goalEl = document.getElementById('goal-text');

    document.getElementById('tap-btn').addEventListener('click', () => {
      count++;
      scoreEl.textContent = count;
      
      const percent = Math.min(100, Math.round((count / target) * 100));
      progressEl.style.width = percent + '%';

      if (count >= target) {
        goalEl.textContent = '🎉 Уровень пройден!';
      }

      // Тактильная виброотдача
      if (tg?.HapticFeedback) {
        tg.HapticFeedback.impactOccurred('medium');
      }
    });

    // Отправка данных боту и закрытие приложения
    document.getElementById('send-btn').addEventListener('click', () => {
      if (tg) {
        const payload = {
          score: count,
          completed: count >= target,
          timestamp: Date.now()
        };
        tg.sendData(JSON.stringify(payload));
      } else {
        alert('Telegram WebApp не обнаружен. Откройте внутри Telegram!');
      }
    });
  </script>
</body>
</html>
