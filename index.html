<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Тёмный Лес: Пиксельные Хроники</title>
<!-- Telegram Mini App SDK -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
:root{
  color-scheme:dark;
  --mc-gold:#f59e0b;
  --mc-gold-light:#fef08a;
  --mc-dark-bg:#121016;
  --mc-panel:#1f1b29;
  --mc-border-light:#4a4458;
  --mc-border-dark:#0d0b12;
  --mc-xp-green:#55ff55;
  --mc-xp-bg:#1e3a1e;
  --mc-red:#ff4d4d;
  --mc-blue:#38bdf8;
  box-sizing:border-box;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;image-rendering:pixelated}
html, body{
  width:100%;
  height:100%;
  overflow-x:hidden;
}
body{
  background:radial-gradient(135% 100% at 50% 0%,#281e3d 0%,#0f0b18 65%,#050308 100%) fixed;
  color:#f1f5f9;
  font-family:'VT323', monospace;
  font-size:20px;
  padding:6px;
  user-select:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  transition:padding 0.25s ease;
}
body.fullscreen{
  padding:2px;
}
.app{
  width:100%;
  max-width:880px;
  display:flex;
  flex-direction:column;
  gap:6px;
  transition:all 0.3s ease;
}

/* Майнкрафт-панели с фаской (Bevel Border) */
.mc-box{
  background:var(--mc-panel);
  border:4px solid var(--mc-border-dark);
  border-top-color:var(--mc-border-light);
  border-left-color:var(--mc-border-light);
  box-shadow:inset -2px -2px 0 #000, 2px 2px 0 rgba(0,0,0,0.5);
  border-radius:2px;
}

/* Верхняя панель */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  padding:5px 10px;
  gap:6px;
}
.brand h1{
  font-family:'Press Start 2P', cursive;
  font-size:0.9rem;
  letter-spacing:1px;
  color:#fef08a;
  text-shadow:2px 2px 0 #854d0e, 0 0 10px rgba(245,158,11,0.5);
}
.brand .tag{font-size:1.1rem;color:#a78bfa}
.stats-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stats-top span{display:flex;align-items:center;gap:3px}
.stats-top b{color:var(--mc-gold);font-size:1.25rem}

.mc-btn{
  background:#3b364c;
  border:3px solid var(--mc-border-dark);
  border-top-color:#635c75;
  border-left-color:#635c75;
  color:#f8fafc;
  font-family:'VT323', monospace;
  font-size:1.2rem;
  padding:3px 8px;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  box-shadow:inset -2px -2px 0 #1b1725;
  transition:filter 0.1s, transform 0.1s;
}
.mc-btn:hover:not(:disabled){filter:brightness(1.15)}
.mc-btn:active:not(:disabled){
  border-color:var(--mc-border-light);
  border-top-color:var(--mc-border-dark);
  border-left-color:var(--mc-border-dark);
  box-shadow:inset 2px 2px 0 #000;
  transform:translate(1px, 1px);
}
.mc-btn:disabled{opacity:0.4;cursor:not-allowed;filter:grayscale(0.6)}

/* Кнопка растягивания / масштабирования */
.btn-stretch{
  background:linear-gradient(135deg, #4338ca, #312e81);
  border-color:#6366f1;
  color:#e0e7ff;
  font-weight:bold;
}

/* Панель боевых характеристик */
.duel{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fc{padding:6px 8px}
.fc-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
.fc-head h2{font-family:'Press Start 2P', cursive;font-size:0.72rem;color:var(--mc-gold-light)}
.fc-head .sub{font-size:1.05rem;color:#94a3b8}

.hp-bar-wrap{
  height:12px;background:#050308;border:2px solid #332b42;border-radius:2px;overflow:hidden;position:relative;
}
.hp-bar-fill{height:100%;transition:width 0.3s ease}
#hpB{background:linear-gradient(90deg,#b91c1c,#ef4444)}
#ehB{background:linear-gradient(90deg,#6b21a8,#a855f7)}
#rageB{background:linear-gradient(90deg,#ea580c,#f97316)}

.xp-bar-box{
  position:relative;height:10px;background:var(--mc-xp-bg);border:1px solid #142914;margin-top:3px;
}
.xp-bar-fill{height:100%;background:linear-gradient(90deg,#22c55e,var(--mc-xp-green))}
.xp-lvl{
  position:absolute;top:-8px;left:50%;transform:translateX(-50%);
  font-family:'Press Start 2P', cursive;font-size:0.58rem;color:var(--mc-xp-green);
  text-shadow:1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000;
}

.intent-badge{
  background:#090610;border:1px dashed var(--mc-gold);padding:2px 6px;
  font-size:1rem;color:#fde047;text-align:center;margin-top:3px;border-radius:2px;
}

/* Холст боя с поддержкой растягивания */
.canvas-holder{
  position:relative;width:100%;overflow:hidden;border:4px solid var(--mc-border-dark);
  transition:all 0.3s ease;
}
canvas{
  display:block;width:100%;height:auto;aspect-ratio:900/440;background:#08060f;
  transition:aspect-ratio 0.3s ease;
}
body.fullscreen canvas{
  aspect-ratio:900/500;
}

/* Хотбар зелий и реликвий */
.hotbar{
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;padding:5px 8px;gap:6px;
}
.potions-shelf{display:flex;gap:5px}
.pot-slot{
  background:#262133;border:2px solid #16121f;border-top-color:#433b54;border-left-color:#433b54;
  padding:2px 7px;font-size:1.1rem;display:flex;align-items:center;gap:4px;cursor:pointer;
}
.pot-slot:hover:not(:disabled){border-color:var(--mc-gold);background:#352d47}
.relics-shelf{display:flex;gap:4px;align-items:center;flex-wrap:wrap;font-size:1rem}
.relic-item{
  background:rgba(245,158,11,0.15);border:1px solid var(--mc-gold);padding:1px 6px;border-radius:2px;
}

/* Хотбар способностей */
.skills-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.skill-btn{
  background:#2d263b;border:3px solid var(--mc-border-dark);border-top-color:#534a69;border-left-color:#534a69;
  padding:6px 4px;color:#f8fafc;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;
  box-shadow:inset -2px -2px 0 #15111c;transition:0.1s;
}
.skill-btn:hover:not(:disabled){border-color:var(--mc-gold);filter:brightness(1.2)}
.skill-btn:active:not(:disabled){transform:translate(1px, 1px);box-shadow:inset 2px 2px 0 #000}
.skill-btn strong{font-family:'Press Start 2P', cursive;font-size:0.6rem;color:var(--mc-gold-light);text-align:center}
.skill-btn small{font-size:1rem;color:#cbd5e1}
.skill-btn:disabled{opacity:0.35;cursor:not-allowed}
.skill-ult{background:linear-gradient(135deg,#581c87,#3b0764);border-color:#c084fc}

/* Хроники */
.log-card{padding:5px 8px}
.log-card h2{font-family:'Press Start 2P', cursive;font-size:0.65rem;color:var(--mc-gold);margin-bottom:3px}
#log{height:65px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;font-size:1.05rem}
#log div{padding-left:6px;border-left:3px solid var(--mc-gold)}
#log .e{border-color:#ef4444;color:#fca5a5}
#log .h{border-color:#22c55e;color:#86efac}
#log .g{border-color:#eab308;color:#fef08a}
#log .p{border-color:#38bdf8;color:#bae6fd}

/* Модалки в стиле Minecraft */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(4px);display:none;place-items:center;z-index:99;padding:12px}
.modal-overlay.on{display:grid}
.modal-content{
  background:#262233;border:4px solid var(--mc-border-dark);border-top-color:#685d82;border-left-color:#685d82;
  box-shadow:0 0 25px rgba(0,0,0,0.9), inset 0 0 15px rgba(0,0,0,0.5);
  max-width:640px;width:100%;padding:16px;text-align:center;
}
.modal-content h2{font-family:'Press Start 2P', cursive;font-size:1.05rem;color:var(--mc-gold-light);margin-bottom:6px}
.modal-content p{font-size:1.2rem;color:#cbd5e1;margin-bottom:12px}
.cards-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.card-item{
  width:180px;background:#1a1724;border:3px solid var(--mc-border-dark);border-top-color:#483f5e;border-left-color:#483f5e;
  padding:10px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;
}
.card-item:hover{border-color:var(--mc-gold);transform:translateY(-3px);background:#2c263d}
.card-item .icon{font-size:2rem}
.card-item strong{font-family:'Press Start 2P', cursive;font-size:0.62rem;color:var(--mc-gold-light);margin-top:3px}
.card-item small{font-size:1rem;color:#94a3b8;line-height:1.2}

@media(max-width:700px){
  .duel{grid-template-columns:1fr 1fr}
  .skills-grid{grid-template-columns:repeat(2,1fr)}
  .card-item{width:130px;padding:6px}
  .brand h1{font-size:0.75rem}
}
</style>
</head>
<body>
<div class="app">
  <!-- Верхняя панель -->
  <header class="mc-box">
    <div class="brand">
      <h1>ТЁМНЫЙ ЛЕС</h1>
      <div class="tag" id="biome-tag">🌲 Опушка Чащи</div>
    </div>
    <div class="stats-top">
      <span>Ур: <b id="top-floor">1</b></span>
      <span>Рекорд: <b id="top-best">1</b></span>
      <span>Опыт: <b id="top-souls">0</b> ✨</span>
      <button class="mc-btn btn-stretch" id="btn-stretch" title="Растянуть на весь экран">⛶ Растянуть</button>
      <button class="mc-btn" id="btn-sound" title="Звук">🔊</button>
      <button class="mc-btn" id="btn-share" title="Отправить боту">💬 Чат</button>
    </div>
  </header>

  <!-- Боевая зона -->
  <div class="duel">
    <!-- Игрок -->
    <div class="mc-box fc">
      <div class="fc-head">
        <h2><span id="p-name">Странник</span></h2>
        <span class="sub" id="p-stats">⚔️ 9 🛡️ 4</span>
      </div>
      <div class="hp-bar-wrap">
        <div class="hp-bar-fill" id="hpB" style="width:100%"></div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:1.15rem;margin-top:2px">
        <span id="hpT">50/50 HP</span>
        <span id="apT" style="color:var(--mc-blue)">⚡ 4/4 AP</span>
      </div>
      <div class="hp-bar-wrap" style="height:6px;margin-top:3px">
        <div class="hp-bar-fill" id="rageB" style="width:0%"></div>
      </div>
      <div class="xp-bar-box">
        <div class="xp-bar-fill" id="xpB" style="width:0%"></div>
        <div class="xp-lvl" id="xpLvl">1</div>
      </div>
    </div>

    <!-- Враг -->
    <div class="mc-box fc">
      <div class="fc-head">
        <h2><span id="e-name">Моб</span></h2>
        <span class="sub" id="e-stats">⚔️ 8 🛡️ 3</span>
      </div>
      <div class="hp-bar-wrap">
        <div class="hp-bar-fill" id="ehB" style="width:100%"></div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:1.15rem;margin-top:2px">
        <span id="ehT">40/40 HP</span>
        <span id="e-badge" style="color:var(--mc-gold)">Обычный</span>
      </div>

  <!-- Экран сражения (Холст Canvas) -->
  <div class="canvas-holder">
    <canvas id="cv" width="900" height="460"></canvas>
  </div>

  <!-- Хотбар предметов и зелий -->
  <div class="mc-box hotbar">
    <div class="potions-shelf">
      <button class="pot-slot mc-btn" id="pot-heal">🧪 Хил <b id="cnt-heal">(1)</b></button>
      <button class="pot-slot mc-btn" id="pot-energy">⚡ Эликсир <b id="cnt-energy">(1)</b></button>
      <button class="pot-slot mc-btn" id="pot-bomb">💣 ТНТ <b id="cnt-bomb">(1)</b></button>
    </div>
    <div class="relics-shelf" id="relics-box">
      <span style="color:var(--mc-gold)">Артефакты:</span>
      <span class="relic-item" style="opacity:0.6">Пусто</span>

  </div>

  <!-- Хотбар способностей -->
  <div class="skills-grid">
    <button class="skill-btn" id="b1"><strong id="b1-n">Меч</strong><small id="b1-d">1 ⚡ Атака</small></button>
    <button class="skill-btn" id="b2"><strong id="b2-n">Топор</strong><small id="b2-d">2 ⚡ Сокрушение</small></button>
    <button class="skill-btn" id="b3"><strong id="b3-n">Щит</strong><small id="b3-d">+2 ⚡ Блок</small></button>
    <button class="skill-btn skill-ult" id="b4"><strong id="b4-n">⚡ СВЕРХСИЛА</strong><small id="b4-d">100% Ярости</small></button>

  <!-- Лог хроник -->
  <div class="mc-box log-card">

</div>

<!-- Модальное окно (Сундук / Выбор пути / Смерть) -->
<div class="modal-overlay" id="modal">
  <div class="modal-content">
    <h2 id="m-title">СУНДУК С НАГРАДОЙ</h2>
    <p id="m-desc">Выберите артефакт или усиление</p>
    <div class="cards-row" id="m-cards"></div>
  </div>
</div>

<script>
(()=>{
// Telegram WebApp
const tg = window.Telegram?.WebApp;
let isFullscreen = false;

if (tg) {
  tg.ready();
}

function toggleStretch() {
  isFullscreen = !isFullscreen;
  if (tg) {
    if (isFullscreen) {
      tg.expand();
    }
  }
  document.body.classList.toggle('fullscreen', isFullscreen);
  $('btn-stretch').textContent = isFullscreen ? '🗗 Свернуть' : '⛶ Растянуть';
  haptic('medium');
}
$('btn-stretch').onclick = toggleStretch;

if (tg?.onEvent) {
  tg.onEvent('viewportChanged', () => {
    if (tg.isExpanded && !isFullscreen) {
      isFullscreen = true;
      document.body.classList.add('fullscreen');
      $('btn-stretch').textContent = '🗗 Свернуть';
    }
  });
}

function haptic(type = 'light') {
  try {
    if (tg?.HapticFeedback) {
      if (type === 'error' || type === 'success') tg.HapticFeedback.notificationOccurred(type);
      else tg.HapticFeedback.impactOccurred(type);
    }
  } catch(e) {}
}

const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d'), W = 900, H = 460;
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

/* ---------- ЗВУКОВОЙ ДВИЖОК MINECRAFT-STYLE ---------- */
let audioCtx = null, sfxOn = true, bgmTimer = null;

function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  startAmbientBgm();
}

function playSfx(type) {
  if (!sfxOn || !audioCtx) return;
  try {
    const t = audioCtx.currentTime;

    if (type === 'sword_hit') {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(260, t);
      o.frequency.exponentialRampToValueAtTime(30, t + 0.12);
      g.gain.setValueAtTime(0.3, t);
      g.gain.exponentialRampToValueAtTime(0.01, t + 0.12);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + 0.12);
    }
    else if (type === 'crit_hit') {
      [380, 520, 680].forEach((f, i) => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = 'triangle';
        o.frequency.setValueAtTime(f, t + i * 0.03);
        o.frequency.exponentialRampToValueAtTime(60, t + i * 0.03 + 0.18);
        g.gain.setValueAtTime(0.25, t + i * 0.03);
        g.gain.exponentialRampToValueAtTime(0.01, t + i * 0.03 + 0.18);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(t + i * 0.03); o.stop(t + i * 0.03 + 0.18);
      });
    }
    else if (type === 'shield_block') {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'square';
      o.frequency.setValueAtTime(90, t);
      o.frequency.linearRampToValueAtTime(50, t + 0.2);
      g.gain.setValueAtTime(0.35, t);
      g.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + 0.2);
    }
    else if (type === 'potion_drink') {
      [360, 420, 480, 620].forEach((freq, idx) => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(freq, t + idx * 0.08);
        g.gain.setValueAtTime(0.2, t + idx * 0.08);
        g.gain.exponentialRampToValueAtTime(0.01, t + idx * 0.08 + 0.07);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(t + idx * 0.08); o.stop(t + idx * 0.08 + 0.07);
      });
    }
    else if (type === 'xp_pickup') {
      const base = 587.33;
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(base, t);
      o.frequency.setValueAtTime(base * 1.25, t + 0.08);
      g.gain.setValueAtTime(0.3, t);
      g.gain.exponentialRampToValueAtTime(0.01, t + 0.35);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + 0.35);
    }
    else if (type === 'tnt_boom') {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(80, t);
      o.frequency.exponentialRampToValueAtTime(20, t + 0.45);
      g.gain.setValueAtTime(0.5, t);
      g.gain.exponentialRampToValueAtTime(0.01, t + 0.45);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + 0.45);
    }
  } catch(e) {}
}

function startAmbientBgm() {
  if (bgmTimer) return;
  const CHORDS = [
    [261.63, 329.63, 392.00],
    [220.00, 261.63, 329.63],
    [174.61, 220.00, 261.63],
    [196.00, 246.94, 293.66]
  ];
  let chordIdx = 0;

  function playNextChord() {
    if (!sfxOn || !audioCtx) {
      bgmTimer = setTimeout(playNextChord, 4000);
      return;
    }
    const chord = CHORDS[chordIdx % CHORDS.length];
    chordIdx++;
    const t = audioCtx.currentTime;

    chord.forEach((f, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(f, t + i * 0.12);
      g.gain.setValueAtTime(0.0001, t + i * 0.12);
      g.gain.linearRampToValueAtTime(0.035, t + i * 0.12 + 1.2);
      g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.12 + 4.5);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t + i * 0.12); o.stop(t + i * 0.12 + 4.6);
    });

    bgmTimer = setTimeout(playNextChord, 4800);
  }
  playNextChord();
}

$('btn-sound').onclick = () => {
  initAudio();
  sfxOn = !sfxOn;
  $('btn-sound').textContent = sfxOn ? '🔊' : '🔇';
};

/* ---------- СИСТЕМА ЧАСТИЦ (MINECRAFT STYLE) ---------- */
let particles = [];
let floatingTexts = [];

class Particle {
  constructor(x, y, type) {
    this.x = x; this.y = y; this.type = type;
    this.vx = (Math.random() - 0.5) * 6;
    this.vy = (Math.random() - 0.7) * 7;
    this.life = 1.0;
    this.size = rnd(4, 9);
    this.gravity = 0.25;

    if (type === 'crit') {
      this.color = '#38bdf8';
      this.decay = 0.025;
    } else if (type === 'xp') {
      this.color = Math.random() < 0.5 ? '#55ff55' : '#eab308';
      this.decay = 0.015;
      this.gravity = -0.05;
    } else if (type === 'heart') {
      this.color = '#ef4444';
      this.decay = 0.02;
      this.gravity = -0.15;
    } else if (type === 'spark') {
      this.color = '#fef08a';
      this.decay = 0.04;
    } else if (type === 'smoke') {
      this.color = '#64748b';
      this.decay = 0.02;
      this.size = rnd(8, 16);
    }
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vy += this.gravity;
    this.life -= this.decay;
  }

  draw(c) {
    c.save();
    c.globalAlpha = Math.max(0, this.life);
    c.fillStyle = this.color;
    c.fillRect(Math.round(this.x), Math.round(this.y), this.size, this.size);
    c.restore();
  }
}

function spawnParticles(x, y, count, type) {
  for (let i = 0; i < count; i++) {
    particles.push(new Particle(x, y, type));
  }
}

function addFloatingText(x, y, text, color) {
  floatingTexts.push({ x, y, text, color, a: 1, vy: -1.4 });
}

let P = {}, E = {}, floor = 1, best = 1, currentClass = 'steve';
let log = [], lock = false, over = false, shake = 0;

try {
  best = +localStorage.getItem('mc_forest_best') || 1;
  $('top-best').textContent = best;
} catch(e) {}

function say(msg, type = '') {
  log.unshift([msg, type]);
  if (log.length > 50) log.pop();
  $('log').innerHTML = log.map(l => `<div class="${l[1]}">${l[0]}</div>`).join('');
}

function showClassSelect() {
  const cards = Object.values(CLASSES).map(c => ({
    ic: c.ic, n: c.name,

function startGame(clsId) {

  const c = CLASSES[clsId];

    classId: clsId, name: c.name,

  };

}

function updateSkillsUI() {
  const sk = CLASSES[currentClass].skills;
  $('b1-n').textContent = sk.s1.name; $('b1-d').textContent = sk.s1.d;
  $('b2-n').textContent = sk.s2.name; $('b2-d').textContent = sk.s2.d;
  $('b3-n').textContent = sk.s3.name; $('b3-d').textContent = sk.s3.d;
  $('b4-n').textContent = sk.s4.name; $('b4-d').textContent = sk.s4.d;
}

function updatePotionsUI() {
  $('cnt-heal').textContent = `(${P.potions.heal})`;
  $('cnt-energy').textContent = `(${P.potions.energy})`;
  $('cnt-bomb').textContent = `(${P.potions.bomb})`;
  $('pot-heal').disabled = P.potions.heal <= 0 || lock || over;
  $('pot-energy').disabled = P.potions.energy <= 0 || lock || over;
  $('pot-bomb').disabled = P.potions.bomb <= 0 || lock || over;
}

function updateRelicsUI() {
  const box = $('relics-box');
  if (P.relics.length === 0) {
    box.innerHTML = '<span style="color:var(--mc-gold)">Артефакты:</span> <span class="relic-item" style="opacity:0.6">Нет</span>';
    return;
  }
  box.innerHTML = '<span style="color:var(--mc-gold)">Артефакты:</span> ' +
    P.relics.map(r => `<span class="relic-item" title="${r.d}">${r.ic} ${r.n}</span>`).join(' ');
}

function spawnNextMob() {
  let template;
  if (floor === 5) template = MOBS_DB[3];
  else if (floor === 10) template = MOBS_DB[5];
  else if (floor >= 15) template = MOBS_DB[6];
  else {
    const regularPool = MOBS_DB.filter(m => !m.boss);
    template = regularPool[rnd(0, regularPool.length - 1)];
  }

  const mult = 1 + (floor - 1) * 0.14;
  E = {
    name: template.n,
    boss: !!template.boss,
    skin: template.skin,
    hp: Math.round(template.hp * mult),
    maxHp: Math.round(template.hp * mult),
    atk: Math.round(template.atk * mult),
    def: Math.round(template.def + Math.floor(floor * 0.5)),
    pat: template.pat, patIdx: 0,
    statuses: { poison: 0, stun: false, guard: 0 },
    int: 'atk'
  };

  nextEnemyIntent();
  say(`⚔️ Из тумана выходит ${E.boss ? 'БОСС: ' : ''}${E.name}!`, 'e');
  ui();
}

function nextEnemyIntent() {
  E.int = E.pat[E.patIdx % E.pat.length];
  E.patIdx++;
}

function onPlayerAction(btnKey) {
  if (lock || over) return;
  initAudio();

  if (btnKey === 'b1') {
    if (P.ap < 1) { say('Недостаточно энергии (⚡)!', 'e'); return; }
    P.ap -= 1;
    let dmg = Math.max(1, Math.round(P.atk - E.def * 0.5));
    if (currentClass === 'wizard') dmg = P.atk;

    const isCrit = Math.random() < (currentClass === 'archer' ? 0.4 : 0.2);
    if (isCrit) {
      dmg = Math.round(dmg * 1.7);
      playSfx('crit_hit');
      spawnParticles(W - 220, H - 240, 18, 'crit');
      say('✨ КРИТИЧЕСКИЙ УДАР В ПРЫЖКЕ!', 'g');
      haptic('heavy');
    } else {
      playSfx('sword_hit');
      spawnParticles(W - 220, H - 240, 8, 'crit');
      haptic('light');
    }

    damageEnemy(dmg, isCrit);
    addRage(15);
    finishTurn();
  }
  else if (btnKey === 'b2') {
    if (P.ap < 2) { say('Нужно 2 ⚡ энергии!', 'e'); return; }
    P.ap -= 2;
    let dmg = Math.round(P.atk * 1.6 - E.def * 0.5);

    if (currentClass === 'steve') {
      E.statuses.stun = true;
      say('💥 Сокрушительный удар топором сломал защиту врага!', 'g');
      playSfx('crit_hit');
    } else if (currentClass === 'archer') {
      E.statuses.poison = 4;
      say('🧪 Стрела с эффектом иссушения поразила моба!', 'p');
      playSfx('crit_hit');
    } else if (currentClass === 'wizard') {
      E.def = Math.max(0, E.def - 3);
      say('❄️ Зелье сковало броню врага!', 'p');
      playSfx('potion_drink');
    }

    damageEnemy(dmg, true);
    spawnParticles(W - 220, H - 240, 20, 'crit');
    addRage(25);
    finishTurn();
  }
  else if (btnKey === 'b3') {
    playSfx('shield_block');
    haptic('medium');
    spawnParticles(220, H - 240, 12, 'spark');
    const gained = Math.min(P.maxAp, P.ap + 2) - P.ap;
    P.ap += gained;

    if (currentClass === 'archer') {
      P.statuses.dodge = true;
      say(`💨 Брошен Жемчуг Эндера: телепорт от следующего удара! (+${gained} ⚡)`, 'p');
    } else {
      P.statuses.guard = true;
      say(`🛡️ Поднят щит: блокирует 60% урона с шипами! (+${gained} ⚡)`, 'h');
    }

    addRage(10);
    finishTurn();
  }
  else if (btnKey === 'b4') {
    if (P.rage < 100) { say('Шкала ярости еще не заряжена (нужно 100%)!', 'e'); return; }
    P.rage = 0;
    playSfx('crit_hit');
    playSfx('tnt_boom');
    shake = 22;
    spawnParticles(W - 220, H - 240, 35, 'crit');
    spawnParticles(W - 220, H - 240, 20, 'smoke');
    const ultDmg = Math.round(P.atk * 3.4);
    say(`⚡ СВЕРХСИЛА РАЗРЯЖЕНА! Нанесено ${ultDmg} катастрофического урона!`, 'g');
    damageEnemy(ultDmg, true);
    finishTurn();
  }
}

function damageEnemy(dmg, isBig = false) {
  E.hp = Math.max(0, E.hp - dmg);
  anim.p.lunge = 80; anim.p.swing = 1.3; anim.e.flash = 1;
  shake = isBig ? 12 : 6;
  addFloatingText(W - 220, H - 260, '-' + dmg + (isBig ? '💥' : ''), isBig ? '#ef4444' : '#fef08a');
}

function addRage(amt) {
  P.rage = Math.min(100, P.rage + amt);
}

function finishTurn() {
  ui();
  if (E.hp <= 0) {
    onMobDefeated();
    return;
  }
  lock = true;
  setTimeout(enemyTurnAction, 650);
}

function enemyTurnAction() {
  if (E.statuses.stun) {
    E.statuses.stun = false;
    say(`💫 ${E.name} оглушен и пропускает ход!`, 'g');
    postEnemyAction();
    return;
  }

  if (E.int === 'guard') {
    E.statuses.guard += 4;
    say(`🛡️ ${E.name} встал в блок (+4 брони).`, 'e');
  } else if (E.int === 'prep') {
    say(`⏳ ${E.name} издает грозный рык, готовя мощную атаку!`, 'e');
  } else if (E.int === 'poison' || E.int === 'wither') {
    inflictPlayer(Math.round(E.atk * 0.7));
    P.statuses.bleed = Math.max(P.statuses.bleed, 3);
    say(`💀 ${E.name} наложил иссушение (-3 HP в ход)!`, 'e');
  } else if (E.int === 'swift') {
    say(`⚡ Двойной взмах ${E.name}!`, 'e');
    inflictPlayer(Math.round(E.atk * 0.6));
    if (P.hp > 0) inflictPlayer(Math.round(E.atk * 0.6));
  } else if (E.int === 'heavy' || E.int === 'nuke') {
    say(`💢 КРУШАЩИЙ УДАР ${E.name}!`, 'e');
    inflictPlayer(Math.round(E.atk * 1.8));
  } else {
    inflictPlayer(E.atk);
  }

  postEnemyAction();
}

function inflictPlayer(rawDmg) {
  if (P.statuses.dodge) {
    P.statuses.dodge = false;
    say('💨 Уворот! Моб промахнулся сквозь портал края.', 'g');
    addFloatingText(220, H - 260, 'УВОРОТ!', '#38bdf8');
    playSfx('xp_pickup');
    return;
  }

  let dmg = Math.max(1, Math.round(rawDmg - P.def * 0.5));
  if (P.statuses.guard) {
    dmg = Math.max(1, Math.round(dmg * 0.4));
    playSfx('shield_block');
    spawnParticles(220, H - 240, 10, 'spark');
    say('🛡️ Щит заблокировал большую часть урона!', 'h');
    E.hp = Math.max(0, E.hp - 6);
    addFloatingText(W - 220, H - 240, '-6🌹', '#ef4444');
  } else {
    playSfx('sword_hit');
  }

  P.hp = Math.max(0, P.hp - dmg);
  anim.e.lunge = 80; anim.e.swing = 1.3; anim.p.flash = 1;
  shake = 9;
  addFloatingText(220, H - 260, '-' + dmg, '#ef4444');
  addRage(15);
  haptic('medium');
}

function postEnemyAction() {
  P.statuses.guard = false;

  if (P.statuses.bleed > 0) {
    P.hp = Math.max(0, P.hp - 3);
    P.statuses.bleed--;
    addFloatingText(220, H - 220, '-3💀', '#c084fc');
  }

  if (E.statuses.poison > 0 && E.hp > 0) {
    E.hp = Math.max(0, E.hp - 5);
    E.statuses.poison--;
    addFloatingText(W - 220, H - 220, '-5🧪', '#84cc16');
  }

  if (E.hp <= 0) {
    onMobDefeated();
    return;
  }
  if (P.hp <= 0) {
    onPlayerDeath();
    return;
  }

  P.ap = Math.min(P.maxAp, P.ap + 1);
  nextEnemyIntent();
  lock = false;
  ui();
}

function onMobDefeated() {
  lock = true;
  playSfx('xp_pickup');
  haptic('success');

  const xpGain = rnd(10, 18) + (E.boss ? 35 : 0);
  P.xp += xpGain;
  floor++;
  if (floor > best) {
    best = floor;
    try { localStorage.setItem('mc_forest_best', best); } catch(e) {}
    $('top-best').textContent = best;
  }

  spawnParticles(W - 220, H - 240, 25, 'xp');
  say(`🏆 ${E.name} повержен! Подобрано +${xpGain} сфер опыта ✨.`, 'g');
  ui();

  setTimeout(showLootChest, 750);
}

function showLootChest() {
  const loot = [
    { ic: '🍎', n: 'Золотое Яблоко', d: '+15 макс. HP и полный хил', f: () => { P.maxHp += 15; P.hp = P.maxHp; playSfx('potion_drink'); spawnParticles(220, H - 240, 15, 'heart'); nextEncounter(); } },
    { ic: '💎', n: 'Алмазная Заточка', d: '+3 к постоянной атаке', f: () => { P.atk += 3; playSfx('crit_hit'); nextEncounter(); } },
    { ic: '🧪', n: 'Связка Зелий', d: '+1 Хил и +1 ТНТ бомба', f: () => { P.potions.heal++; P.potions.bomb++; updatePotionsUI(); playSfx('potion_drink'); nextEncounter(); } }
  ];
  openModal('СУНДУК С ЛУТОМ', 'Выберите награду за победу над мобом:', loot);
}

function nextEncounter() {
  const rooms = [
    { ic: '⚔️', n: 'Пещера монстров', d: 'Обычное сражение', f: () => { spawnNextMob(); lock = false; } },
    { ic: '⛺', n: 'Лагерный костер', d: 'Привал: отдых и +50% HP', f: () => restAtCamp() },
    { ic: '🛒', n: 'Житель-Торговец', d: 'Купить зелья за опыт', f: () => tradeVillager() }
  ];
  openModal(`ТРОПА ЭТАЖА ${floor}`, 'Куда повернет твой путь дальше?', rooms);
}

function restAtCamp() {
  const h = Math.round(P.maxHp * 0.5);
  P.hp = Math.min(P.maxHp, P.hp + h);
  P.statuses.bleed = 0;
  playSfx('potion_drink');
  spawnParticles(220, H - 240, 16, 'heart');
  say(`⛺ Ты отдохнул у лагерного костра: +${h} HP восстановлено!`, 'h');
  spawnNextMob();
  lock = false;
}

function tradeVillager() {
  const trades = [
    { ic: '🧪', n: 'Зелье жизни', d: '15 опыта · +30 HP в бою', f: () => {
      if (P.xp >= 15) { P.xp -= 15; P.potions.heal++; updatePotionsUI(); playSfx('xp_pickup'); say('Куплено зелье жизни!', 'g'); }
      spawnNextMob(); lock = false;
    }},
    { ic: '💣', n: 'Связка ТНТ', d: '20 опыта · Взрыв на 25 урона', f: () => {
      if (P.xp >= 20) { P.xp -= 20; P.potions.bomb++; updatePotionsUI(); playSfx('xp_pickup'); say('Куплен блок ТНТ!', 'g'); }
      spawnNextMob(); lock = false;
    }},
    { ic: '🛡️', n: 'Алмазный нагрудник', d: '30 опыта · +3 к броне', f: () => {
      if (P.xp >= 30) { P.xp -= 30; P.def += 3; playSfx('shield_block'); say('Броня улучшена на +3!', 'g'); }
      spawnNextMob(); lock = false;
    }}
  ];
  openModal('ДЕРЕВЕНСКИЙ ТОРГОВЕЦ', `У тебя ${P.xp} опыта ✨. Что хочешь обменять?`, trades);
}

function onPlayerDeath() {
  over = true; lock = true;
  haptic('error');
  say(`☠️ ${P.name} погиб на этаже ${floor}...`, 'e');
  ui();

  setTimeout(() => {
    openModal('ТЫ ПОГИБ!', `Счёт: Этаж ${floor} · Рекорд: ${best} · Опыт: ${P.xp}`, [
      { ic: '🔄', n: 'Возродиться', d: 'Выбрать класс и начать заново', f: () => showClassSelect() },
      { ic: '💬', n: 'Отправить в чат', d: 'Поделиться рекордом с ботом', f: () => sendScoreToBot() }
    ]);
  }, 800);
}

$('pot-heal').onclick = () => {
  if (P.potions.heal <= 0 || lock || over) return;
  P.potions.heal--;
  const h = Math.min(30, P.maxHp - P.hp);
  P.hp += h;
  playSfx('potion_drink');
  spawnParticles(220, H - 240, 16, 'heart');
  say(`🧪 Выпито зелье исцеления: +${h} HP!`, 'h');
  updatePotionsUI(); ui();
};

$('pot-energy').onclick = () => {
  if (P.potions.energy <= 0 || lock || over) return;
  P.potions.energy--;
  P.ap = Math.min(P.maxAp, P.ap + 3);
  playSfx('potion_drink');
  say('⚡ Эликсир бодрости восстановил +3 энергии!', 'p');
  updatePotionsUI(); ui();
};

$('pot-bomb').onclick = () => {
  if (P.potions.bomb <= 0 || lock || over) return;
  P.potions.bomb--;
  const dmg = 26;
  playSfx('tnt_boom');
  shake = 16;
  spawnParticles(W - 220, H - 240, 25, 'smoke');
  spawnParticles(W - 220, H - 240, 20, 'crit');
  damageEnemy(dmg, true);
  say(`💣 Блок ТНТ взорвался прямо под ногами врага на ${dmg} урона!`, 'g');
  updatePotionsUI(); ui();
  if (E.hp <= 0) onMobDefeated();
};

function openModal(title, desc, items) {
  $('m-title').textContent = title;
  $('m-desc').innerHTML = desc;
  const grid = $('m-cards');
  grid.innerHTML = '';
  items.forEach(it => {
    const btn = document.createElement('div');
    btn.className = 'card-item';
    btn.innerHTML = `<div class="icon">${it.ic}</div><strong>${it.n}</strong><small>${it.d}</small>`;
    btn.onclick = () => {
      $('modal').classList.remove('on');
      it.f();
      ui();
    };
    grid.appendChild(btn);
  });
  $('modal').classList.add('on');
}

function ui() {
  $('top-floor').textContent = floor;
  $('top-souls').textContent = P.xp;
  $('xpLvl').textContent = floor;
  $('xpB').style.width = Math.min(100, (P.xp % 30) / 30 * 100) + '%';

  $('p-name').textContent = P.name;
  $('p-stats').textContent = `⚔️ ${P.atk} 🛡️ ${P.def}`;
  $('hpT').textContent = `${P.hp}/${P.maxHp} HP`;
  $('hpB').style.width = Math.max(0, (P.hp / P.maxHp) * 100) + '%';
  $('apT').textContent = `⚡ ${P.ap}/${P.maxAp} AP`;
  $('rageB').style.width = P.rage + '%';
  $('b4').disabled = P.rage < 100 || lock || over;

  if (E && E.maxHp) {
    $('e-name').textContent = E.name;
    $('e-stats').textContent = `⚔️ ${E.atk} 🛡️ ${E.def + (E.statuses.guard || 0)}`;
    $('ehT').textContent = `${E.hp}/${E.maxHp} HP`;
    $('ehB').style.width = Math.max(0, (E.hp / E.maxHp) * 100) + '%';
    $('e-badge').textContent = E.boss ? '👑 БОСС' : 'Моб';

    let intTxt = '⚔️ Атака (≈' + E.atk + ')';
    if (E.int === 'guard') intTxt = '🛡️ Блок (+4 брони)';
    else if (E.int === 'prep') intTxt = '⏳ Рык ярости...';
    else if (E.int === 'poison' || E.int === 'wither') intTxt = '💀 Эффект иссушения';
    else if (E.int === 'swift') intTxt = '⚡ Двойной взмах';
    else if (E.int === 'heavy') intTxt = '💢 Крушащий удар (≈' + Math.round(E.atk * 1.8) + ')';
    $('eIntent').textContent = intTxt;
  }

  $('b1').disabled = lock || over || P.ap < 1;
  $('b2').disabled = lock || over || P.ap < 2;
  $('b3').disabled = lock || over;
  updatePotionsUI();
}

function sendScoreToBot() {
  if (tg) {
    tg.sendData(JSON.stringify({
      game: 'Тёмный Лес',
      class: P.name,
      floor: floor,
      best: best,
      xp: P.xp,
      timestamp: Date.now()
    }));
  } else {
    alert(`Твой рекорд: Этаж ${best}, Опыт: ${P.xp}`);
  }
}
$('btn-share').onclick = sendScoreToBot;

$('b1').onclick = () => onPlayerAction('b1');
$('b2').onclick = () => onPlayerAction('b2');
$('b3').onclick = () => onPlayerAction('b3');
$('b4').onclick = () => onPlayerAction('b4');

/* ---------- ВОКСЕЛЬНАЯ / ПИКСЕЛЬ-АРТ ГРАФИКА CANVAS ---------- */
function drawVoxelBox(c, x, y, w, h, colTop, colSide, colFront) {
  c.fillStyle = colFront;
  c.fillRect(x, y, w, h);
  c.fillStyle = colTop;
  c.fillRect(x, y, w, Math.round(h * 0.25));
  c.fillStyle = colSide;
  c.fillRect(x + w - Math.round(w * 0.2), y, Math.round(w * 0.2), h);
}

function drawVoxelMob(c, x, y, skin, lunge, swing, flash, dir = 1) {
  c.save();
  c.translate(x + lunge * dir, y);
  c.scale(dir, 1);

  if (flash > 0.1) c.filter = `brightness(${1 + flash * 2})`;

  c.fillStyle = 'rgba(0,0,0,0.55)';
  c.beginPath(); c.ellipse(0, 0, 45, 10, 0, 0, Math.PI * 2); c.fill();

  if (skin === 'player' || skin === 'steve') {
    drawVoxelBox(c, -22, -45, 18, 45, '#1e3a8a', '#172554', '#2563eb');
    drawVoxelBox(c, 4, -45, 18, 45, '#1e3a8a', '#172554', '#2563eb');
    drawVoxelBox(c, -24, -100, 48, 55, '#06b6d4', '#0891b2', '#22d3ee');
    drawVoxelBox(c, -20, -145, 40, 45, '#ca8a04', '#a16207', '#eab308');
    c.fillStyle = '#ffffff'; c.fillRect(2, -132, 8, 8); c.fillStyle = '#2563eb'; c.fillRect(6, -130, 4, 6);

    c.save();
    c.translate(24, -75);
    c.rotate(0.3 + swing * 1.5);
    c.fillStyle = '#38bdf8'; c.fillRect(-4, -85, 8, 85);
    c.fillStyle = '#0284c7'; c.fillRect(-2, -85, 4, 85);
    c.fillStyle = '#d97706'; c.fillRect(-12, 0, 24, 6);
    c.fillStyle = '#78350f'; c.fillRect(-3, 6, 6, 16);
    c.restore();
  }
  else if (skin === 'zombie') {
    drawVoxelBox(c, -20, -45, 16, 45, '#1e3a8a', '#172554', '#2563eb');
    drawVoxelBox(c, 4, -45, 16, 45, '#1e3a8a', '#172554', '#2563eb');
    drawVoxelBox(c, -22, -95, 44, 50, '#065f46', '#047857', '#059669');
    drawVoxelBox(c, -18, -135, 36, 40, '#047857', '#065f46', '#10b981');
    c.fillStyle = '#000'; c.fillRect(-8, -122, 6, 6); c.fillRect(6, -122, 6, 6);
    c.fillStyle = '#10b981'; c.fillRect(10, -85, 45, 16);
  }
  else if (skin === 'skeleton') {
    drawVoxelBox(c, -16, -45, 10, 45, '#cbd5e1', '#94a3b8', '#e2e8f0');
    drawVoxelBox(c, 6, -45, 10, 45, '#cbd5e1', '#94a3b8', '#e2e8f0');
    drawVoxelBox(c, -18, -95, 36, 50, '#94a3b8', '#64748b', '#cbd5e1');
    drawVoxelBox(c, -20, -140, 40, 45, '#cbd5e1', '#94a3b8', '#f8fafc');
    c.fillStyle = '#0f172a'; c.fillRect(-12, -125, 8, 8); c.fillRect(4, -125, 8, 8);
    c.strokeStyle = '#b45309'; c.lineWidth = 4;
    c.beginPath(); c.arc(20, -75, 32, -1.2, 1.2); c.stroke();
  }
  else {
    const sz = 1.35;
    c.scale(sz, sz);
    drawVoxelBox(c, -25, -50, 22, 50, '#64748b', '#475569', '#94a3b8');
    drawVoxelBox(c, 4, -50, 22, 50, '#64748b', '#475569', '#94a3b8');
    drawVoxelBox(c, -35, -120, 70, 70, '#475569', '#334155', '#64748b');
    drawVoxelBox(c, -20, -160, 40, 40, '#94a3b8', '#64748b', '#cbd5e1');
    c.fillStyle = '#ef4444'; c.fillRect(-10, -145, 6, 6); c.fillRect(4, -145, 6, 6);
  }

  c.restore();
}

function renderVoxelWorld(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0c071a');
  g.addColorStop(0.7, '#1f1638');
  g.addColorStop(1, '#090514');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // Квадратная луна Minecraft
  ctx.fillStyle = '#fef08a';
  ctx.fillRect(W - 130, 40, 55, 55);
  ctx.fillStyle = '#ca8a04';
  ctx.fillRect(W - 120, 50, 20, 20);

  // Деревья
  for (let i = 0; i < 6; i++) {
    const tx = i * 160 + 20;
    ctx.fillStyle = '#451a03';
    ctx.fillRect(tx + 24, H - 180, 24, 120);
    ctx.fillStyle = '#14532d';
    ctx.fillRect(tx, H - 240, 72, 60);
    ctx.fillStyle = '#15803d';
    ctx.fillRect(tx + 12, H - 270, 48, 30);
  }

  // Земля и трава
  const groundY = H - 60;
  ctx.fillStyle = '#1e3a1e';
  ctx.fillRect(0, groundY, W, 14);
  ctx.fillStyle = '#3f2512';
  ctx.fillRect(0, groundY + 14, W, 46);
  ctx.fillStyle = '#15803d';
  for (let x = 0; x < W; x += 16) {
    ctx.fillRect(x, groundY + 14, 8, 6);
  }

  // Фонари душ
  const fX = 110, fY = groundY - 70;
  ctx.fillStyle = '#0f172a'; ctx.fillRect(fX, fY, 16, 26);
  ctx.fillStyle = '#38bdf8'; ctx.fillRect(fX + 4, fY + 6, 8, 12);
  ctx.shadowColor = '#38bdf8'; ctx.shadowBlur = 18;
  ctx.fillRect(fX + 5, fY + 8, 6, 8);
  ctx.shadowBlur = 0;

  drawVoxelMob(ctx, 220, groundY - 5, 'steve', anim.p.lunge, anim.p.swing, anim.p.flash, 1);
  if (E && E.name) {
    drawVoxelMob(ctx, W - 220, groundY - 5, E.skin || 'zombie', anim.e.lunge, anim.e.swing, anim.e.flash, -1);
  }

  particles.forEach(p => { p.update(); p.draw(ctx); });
  particles = particles.filter(p => p.life > 0);

  floatingTexts.forEach(f => {
    ctx.save();
    ctx.globalAlpha = Math.max(0, f.a);
    ctx.font = "bold 26px 'VT323', monospace";
    ctx.fillStyle = f.color;
    ctx.shadowColor = '#000'; ctx.shadowBlur = 4;
    ctx.textAlign = 'center';
    ctx.fillText(f.text, f.x, f.y);
    ctx.restore();
    f.a -= 0.018; f.y += f.vy;
  });
  floatingTexts = floatingTexts.filter(f => f.a > 0);
}

function renderLoop(t) {
  for (const k in anim) {
    const o = anim[k];
    o.lunge *= 0.84; o.swing *= 0.86; o.flash *= 0.86;
  }
  shake *= 0.88;

  ctx.save();
  ctx.clearRect(0, 0, W, H);
  if (shake > 0.4) {
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  }
  renderVoxelWorld(t);
  ctx.restore();

  requestAnimationFrame(renderLoop);
}

showClassSelect();
requestAnimationFrame(renderLoop);
})();
</script>
